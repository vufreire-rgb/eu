<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Vinicius Freire — Draw My Life</title>
<meta name="description" content="Minha trajetória, desenhada à mão: resiliência, brio e criatividade antes da inteligência artificial.">
<meta name="theme-color" content="#ffffff">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#111;--paper:#fff;--m:#D49A00;--soft:#555;--line:#e6e6e6;
 --hand:"Caveat","Segoe Print","Bradley Hand","Comic Sans MS",cursive;
 --sans:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--paper);color:var(--ink);font-family:var(--sans);overflow:hidden;
 -webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button,a{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
:focus-visible{outline:2px solid var(--m);outline-offset:3px;border-radius:6px}

#app{position:fixed;inset:0;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}

/* ---------- topo ---------- */
#top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 14px 4px;min-height:48px;z-index:5}
#brand{font-family:var(--hand);font-weight:700;font-size:22px;line-height:1;position:relative;white-space:nowrap}
#brand::after{content:"";position:absolute;left:0;right:0;bottom:-3px;height:3px;background:var(--m);border-radius:3px;transform:rotate(-1deg)}
#tools{display:flex;gap:6px}
.pill{font-size:12.5px;font-weight:500;padding:6px 11px;border:1.5px solid var(--ink);border-radius:999px;background:#fff;line-height:1;white-space:nowrap;transition:background .2s,color .2s}
.pill[aria-pressed=true],.pill[aria-expanded=true]{background:var(--ink);color:#fff}
.pill:hover{background:#f6f6f6}.pill[aria-pressed=true]:hover,.pill[aria-expanded=true]:hover{background:var(--ink)}

/* ---------- palco ---------- */
#stage{flex:1;position:relative;overflow:hidden;touch-action:pan-y;--enter:36px;--leave:-36px}
#stage::before{content:"";position:absolute;inset:-20px;pointer-events:none;
 background:radial-gradient(circle at 12% 18%,rgba(212,154,0,.07) 0 3px,transparent 4px),
            radial-gradient(circle at 88% 70%,rgba(0,0,0,.05) 0 2px,transparent 3px);
 background-size:140px 140px,190px 190px;transform:translate3d(var(--bx,0),var(--by,0),0)}
.slide{position:absolute;inset:0;display:grid;grid-template-rows:auto auto;align-content:center;gap:10px;padding:0 14px 6px;
 opacity:0;visibility:hidden;transform:translateX(var(--enter));
 transition:opacity .55s ease,transform .55s cubic-bezier(.2,.7,.2,1),visibility 0s .55s}
.slide.active{opacity:1;visibility:visible;transform:none;transition-delay:0s}
.slide.out{transform:translateX(var(--leave))}
.art{min-height:0;display:flex;align-items:center;justify-content:center;width:100%;max-width:640px;margin:0 auto;aspect-ratio:4/3;max-height:52svh}
.art svg{width:100%;height:100%;max-height:100%;overflow:visible;transform:translate3d(var(--px,0),var(--py,0),0);transition:transform .25s ease-out}
.txt{width:100%;max-width:640px;margin:0 auto;text-align:center;padding:0 6px 4px}
.kicker{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--m);font-weight:600;margin-bottom:6px}
.main{font-family:var(--hand);font-weight:700;font-size:clamp(28px,7.9vw,54px);line-height:1.02;text-wrap:balance}
.main.quote{font-size:clamp(32px,9.4vw,60px)}
.impact{font-family:var(--hand);font-weight:700;font-size:clamp(21px,5.6vw,30px);line-height:1.1;margin-top:10px;
 background:linear-gradient(transparent 62%,rgba(212,154,0,.38) 62% 92%,transparent 92%);display:inline;padding:0 4px;
 -webkit-box-decoration-break:clone;box-decoration-break:clone}
.sub{font-size:14.5px;color:var(--soft);margin-top:10px;line-height:1.45}
.w{display:inline-block;white-space:nowrap}
.c{display:inline-block}
.sub,.impact,.btns{opacity:0}
.active .sub,.active .impact,.active .btns{animation:fadein .8s ease forwards;animation-delay:var(--dl,1.4s)}
.out .sub,.out .impact,.out .btns{opacity:1}
.c{opacity:0;transform:translateY(5px) rotate(-2deg)}
.active .c{animation:ink .4s ease forwards;animation-delay:calc(var(--d) * 1ms)}
.out .c{opacity:1;transform:none}
@keyframes ink{to{opacity:1;transform:none}}
@keyframes fadein{to{opacity:1}}

/* ---------- ilustrações ---------- */
.art svg *{fill:none;stroke:var(--ink);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.art svg .m{stroke:var(--m)}
.art svg .fm{fill:var(--m);fill-opacity:.88;stroke:var(--m)}
.art svg .fw{fill:#fff}
.art svg .t{fill:var(--ink);stroke:none;font-family:var(--hand);font-weight:700;text-anchor:middle}
.art svg .t.mu{fill:var(--m)}
.art svg .t.l{text-anchor:start}
.art svg .t tspan{fill:var(--ink);stroke:none}
.art svg .t.mu tspan{fill:var(--m)}
.art .d{stroke-dasharray:1 1.6;stroke-dashoffset:1.03}
.art .f{opacity:0}
.active .art .d{animation:draw var(--t,1s) cubic-bezier(.5,0,.3,1) forwards;animation-delay:var(--dl,.2s)}
.active .art .f{animation:fadein .6s ease forwards;animation-delay:var(--dl,.2s)}
.out .art .d{stroke-dashoffset:0}
.out .art .f{opacity:1}
@keyframes draw{to{stroke-dashoffset:0}}
.art g[filter]{will-change:auto}
html.lite .art g[filter]{filter:none}
.bob{transform-box:fill-box;transform-origin:center}
.active .bob{animation:bob 3.4s ease-in-out infinite;animation-delay:calc(var(--k,0) * -.7s)}
@keyframes bob{50%{transform:translateY(-5px) rotate(2deg)}}
.spin{transform-box:fill-box;transform-origin:center}
.active .spin{animation:spin 16s linear infinite}
.active .spin.r{animation-direction:reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.vn{opacity:0}
.active .vn{animation:vn 6s ease-in-out infinite;animation-delay:calc(var(--k) * 1.1s)}
@keyframes vn{0%{opacity:0;transform:translateY(8px)}18%,55%{opacity:1;transform:none}80%,100%{opacity:0;transform:translateY(-8px)}}
.blink{opacity:0}
.active .blink{animation:blink 2.2s ease-in-out infinite;animation-delay:2.2s}
@keyframes blink{50%{opacity:1}}

/* ---------- narração ---------- */
#drawer{position:fixed;left:0;right:0;bottom:calc(60px + env(safe-area-inset-bottom));max-height:46svh;background:#fff;z-index:4;
 border:2.5px solid var(--ink);border-bottom:0;border-radius:18px 18px 0 0;box-shadow:0 -10px 30px rgba(0,0,0,.08);
 transform:translateY(calc(100% + 90px));visibility:hidden;transition:transform .45s cubic-bezier(.2,.7,.2,1),visibility 0s .45s;display:flex;flex-direction:column}
#drawer.open{transform:none;visibility:visible;transition-delay:0s}
#drawer header{display:flex;justify-content:space-between;align-items:center;padding:12px 20px 4px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--m);font-weight:600}
#drawer header button{font-size:20px;line-height:1;color:var(--ink);padding:2px 6px}
#narr{overflow:auto;padding:4px 20px 18px;max-width:680px;margin:0 auto;width:100%}
#narr p{font-size:16.5px;line-height:1.55;margin:0 0 .75em;color:#222;transition:opacity .3s,background .3s}
#narr p.say{background:linear-gradient(transparent 60%,rgba(212,154,0,.3) 60%)}
#narr p.q{font-family:var(--hand);font-weight:700;font-size:26px;line-height:1.15;text-align:center;color:var(--ink)}
@supports (animation-timeline:view()){
 #narr p{animation:pin linear both;animation-timeline:view(block);animation-range:entry 0% entry 70%}
 @keyframes pin{from{opacity:.15;transform:translateY(8px)}to{opacity:1;transform:none}}
}

/* ---------- rodapé: a linha da trajetória ---------- */
#bar{display:flex;align-items:center;gap:6px;padding:2px 10px calc(8px + env(safe-area-inset-bottom));z-index:5}
.nav{width:46px;height:46px;border-radius:50%;border:1.5px solid var(--ink);display:grid;place-items:center;background:#fff;flex:none;transition:transform .15s,opacity .2s}
.nav:active{transform:scale(.92)}
.nav:disabled{opacity:.25;cursor:default}
.nav svg{width:20px;height:20px;fill:none;stroke:var(--ink);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
#trailWrap{position:relative;flex:1;height:46px}
#trail{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
#trail path{fill:none;vector-effect:non-scaling-stroke;stroke-linecap:round;stroke-linejoin:round}
#trailBg{stroke:#d9d9d9;stroke-width:2}
#trailFg{stroke:var(--ink);stroke-width:2.6;stroke-dasharray:1 1.6;transition:stroke-dashoffset .9s cubic-bezier(.4,0,.2,1)}
#pen{position:absolute;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;background:var(--m);box-shadow:0 0 0 3px #fff;
 transition:left .9s cubic-bezier(.4,0,.2,1),top .9s cubic-bezier(.4,0,.2,1)}
#count{position:absolute;left:50%;top:-4px;transform:translateX(-50%);font-family:var(--hand);font-weight:700;font-size:17px;background:#fff;padding:0 8px;line-height:1}

/* ---------- finale ---------- */
.btns{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:14px}
.btn{display:inline-flex;align-items:center;font-size:13.5px;font-weight:500;padding:9px 15px;border:1.8px solid var(--ink);border-radius:999px;background:#fff;text-decoration:none;line-height:1;transition:transform .15s,background .2s}
.btn:hover{background:#f6f6f6;transform:translateY(-1px) rotate(-.6deg)}
.btn.pri{background:var(--ink);color:#fff}
.btn.pri:hover{background:#222}
.btn[data-pending]{border-style:dashed}
.btn[data-pending]::after{content:"";width:6px;height:6px;border-radius:50%;background:var(--m);margin-left:8px}
#toast{position:fixed;left:50%;bottom:92px;transform:translate(-50%,20px);background:var(--ink);color:#fff;font-size:13px;padding:10px 16px;border-radius:12px;opacity:0;pointer-events:none;transition:.3s;z-index:20;max-width:88vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}

/* ---------- desktop ---------- */
@media (min-width:900px) and (min-height:560px){
 .slide{grid-template-rows:none;grid-template-columns:1.2fr 1fr;align-items:center;align-content:normal;gap:40px;padding:0 6vw 10px}
 .art{max-width:none;height:min(100%,560px);aspect-ratio:auto;max-height:none}
 .txt{text-align:left;max-width:none;align-self:center}
 .btns{justify-content:flex-start}
 .main{font-size:clamp(40px,4.4vw,64px)}
 .main.quote{font-size:clamp(42px,4.8vw,70px)}
 .sub{font-size:16px}
 #bar{max-width:900px;margin:0 auto;width:100%}
 #drawer{left:50%;right:auto;width:min(720px,92vw);transform:translate(-50%,calc(100% + 90px));max-height:50svh}
 #drawer.open{transform:translate(-50%,0)}
}
@media (max-height:640px) and (max-width:899px){
 .main{font-size:clamp(26px,7vw,40px)}.sub{margin-top:6px;font-size:13px}.kicker{margin-bottom:3px}
}

/* ---------- movimento reduzido ---------- */
html.rm *,html.rm *::before,html.rm *::after{animation:none!important;transition:none!important}
html.rm .art .d{stroke-dashoffset:0}
html.rm .art .f,html.rm .art .vn,html.rm .c,html.rm .sub,html.rm .impact,html.rm .btns{opacity:1}
html.rm .c{transform:none}
html.rm #narr p{opacity:1;transform:none}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
 <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
  <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="7" result="n"/>
  <feDisplacementMap in="SourceGraphic" in2="n" scale="3.4" xChannelSelector="R" yChannelSelector="G"/>
 </filter>
</svg>

<div id="app">
 <div id="top">
  <div id="brand">Vinicius Freire</div>
  <div id="tools">
   <button class="pill" id="bAuto" aria-pressed="false">▶ Auto</button>
   <button class="pill" id="bVoice" aria-pressed="false" hidden>Voz</button>
   <button class="pill" id="bNarr" aria-expanded="false" aria-controls="drawer">Narração</button>
  </div>
 </div>

 <main id="stage"></main>

 <section id="drawer" aria-label="Narração" role="region">
  <header><span>Narração · legenda</span><button id="bClose" aria-label="Fechar narração">×</button></header>
  <div id="narr"></div>
 </section>

 <footer id="bar">
  <button class="nav" id="prev" aria-label="Slide anterior"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
  <div id="trailWrap" role="progressbar" aria-valuemin="1" aria-valuemax="22" aria-valuenow="1" aria-label="Progresso da história">
   <svg id="trail" viewBox="0 0 1000 46" preserveAspectRatio="none" aria-hidden="true"><path id="trailBg"/><path id="trailFg" pathLength="1"/></svg>
   <i id="pen"></i><span id="count">01 / 22</span>
  </div>
  <button class="nav" id="next" aria-label="Próximo slide"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
 </footer>
</div>
<div id="toast" role="status"></div>

<script>
/* =====================================================================
   CONFIGURAÇÃO — links do slide final.
   Deixe vazio ('') enquanto não houver o endereço real. Nada é inventado:
   botão sem link mostra um aviso ao ser tocado.
   ===================================================================== */
const LINKS = {
  // PROVISÓRIO: trocar pela URL real da Vercel após a publicação
  gabinete: 'https://gabinete-digital.vercel.app',
  whatsapp: 'https://wa.me/5512991122596?text=' + encodeURIComponent('Olá, Vinicius! Assisti à sua apresentação e gostaria de conversar.')
};

/* Voz: se existirem arquivos audio/01.mp3 ... audio/22.mp3 (sua própria gravação
   ou uma voz sintética de qualidade), eles tocam no lugar da voz do navegador. */
const AUDIO = { dir: 'audio/', ext: 'mp3' };

/* ---------------------- helpers de desenho ---------------------- */
const UP='M0 -47 L-13 -63 M0 -47 L13 -63';
const person=(x,y,s=1,o={})=>{
  const arms=o.arms||'M0 -47 L-13 -33 M0 -47 L13 -33';
  const hair=o.hair===false?'':`<path class="m" d="M-8 -68 Q-3 -79 4 -72 Q10 -71 9 -65"/>`;
  return `<g transform="translate(${x} ${y}) scale(${s})" style="stroke-width:${(2.6/s).toFixed(2)}px"><circle cx="0" cy="-62" r="9"/>${hair}<path d="M0 -53 L0 -25"/><path d="${arms}"/><path d="${o.legs||'M0 -25 L-9 0 M0 -25 L9 0'}"/>${o.extra||''}</g>`;
};
const ground=(y=250)=>`<path class="d" d="M16 ${y} C90 ${y-4} 150 ${y+4} 220 ${y} S340 ${y-3} 384 ${y+1}"/>`;
const T=(x,y,s,sz=16,cls='')=>`<text class="t f ${cls}" x="${x}" y="${y}" font-size="${sz}">${s}</text>`;
const TL=(x,y,lines,sz=12,lh=1.15,cls='')=>`<text class="t f ${cls}" x="${x}" y="${y}" font-size="${sz}">${lines.map((l,i)=>`<tspan x="${x}" dy="${i?sz*lh:0}">${l}</tspan>`).join('')}</text>`;
const gear=(cx,cy,r,n,ph=0,cls='d')=>{
  const h=r*.24,pts=[];
  for(let i=0;i<n;i++){const a=ph+i*2*Math.PI/n,w=Math.PI/n;
    [[r-h,a-w*.8],[r,a-w*.42],[r,a+w*.42],[r-h,a+w*.8]].forEach(([q,t])=>pts.push((cx+q*Math.cos(t)).toFixed(1)+' '+(cy+q*Math.sin(t)).toFixed(1)));}
  return `<path class="${cls}" d="M${pts.join('L')}Z"/><circle class="d ${cls.includes('m')?'m':''}" cx="${cx}" cy="${cy}" r="${(r*.26).toFixed(1)}"/>`;
};
const arrow=(d,hx,hy,ang=0,cls='d m')=>`<path class="${cls}" d="${d}"/><path class="${cls}" d="M${hx-9} ${hy-8} L${hx} ${hy} L${hx-9} ${hy+8}" transform="rotate(${ang} ${hx} ${hy})"/>`;

/* ---------------------- as 22 ilustrações ---------------------- */
const ART={};
ART[1]=()=>`<path id="morph" class="d" style="--t:1.8s;stroke-width:3.2"/>
<path class="d m" d="M96 272 Q200 284 306 270" style="--t:1.2s"/>
<g class="f" style="--dl:2s"><circle id="dot0" cx="168" cy="292" r="4"/><circle id="dot1" cx="189" cy="292" r="4"/><circle id="dot2" cx="211" cy="292" r="4"/><circle id="dot3" cx="232" cy="292" r="4"/></g>`;

ART[2]=()=>ground()+`
<path class="d" d="M48 250 V166 L112 114 L176 166 V250"/>
<path class="d m" d="M36 174 L112 106 L188 174"/>
<path class="d" d="M144 138 V112 H160 V150"/>
<path class="d" d="M96 250 V206 H124 V250"/>
<rect class="d" x="138" y="186" width="24" height="24"/><path class="d" d="M150 186 V210 M138 198 H162"/>
<circle class="d m" cx="352" cy="46" r="17"/>
${person(212,250,.55,{arms:UP})}${person(240,250,.46,{arms:UP})}${person(270,250,.62,{arms:UP})}${person(300,250,.5,{arms:UP})}
${person(343,250,.82,{arms:'M0 -47 L-12 -34 M0 -47 L14 -30',extra:'<rect x="12" y="-32" width="12" height="9"/>'})}
${person(375,250,.74,{hair:false})}
${T(112,284,'1999',26,'mu')}`;

ART[3]=()=>ground()+`
${person(78,250,1,{arms:'M0 -47 L14 -42 M0 -47 L15 -34'})}
<rect class="d" x="118" y="226" width="54" height="18" rx="5"/><circle class="d" cx="132" cy="246" r="6"/><circle class="d" cx="158" cy="246" r="6"/>
<g class="bob" style="--k:0"><circle class="d" cx="236" cy="104" r="34"/><circle class="d" cx="236" cy="104" r="6"/><path class="d" d="M236 70V138M202 104H270M212 80L260 128M260 80L212 128"/></g>
<g class="bob" style="--k:1">${gear(318,84,25,8,0,'d m')}</g>
<g class="bob" style="--k:2">${gear(312,166,17,6,.2)}</g>
<g class="bob" style="--k:3"><path class="d" d="M150 52 l12 8 l-24 9 l24 9 l-24 9 l12 8"/></g>
<g class="bob" style="--k:4"><path class="d" d="M178 160 l12 -7 l12 7 v14 l-12 7 l-12 -7z"/></g>
<path class="d m" d="M106 196 L132 152 M118 200 L168 168 M96 190 L100 140"/>
${T(46,110,'?',64,'mu')}`;

ART[4]=()=>ground()+`
<path class="d" d="M24 36 H376"/>
<path class="d" d="M40 36 V50 M110 36 V50 M170 36 V50 M240 36 V50 M310 36 V50"/>
<path class="d" d="M40 52 L100 52 L100 70 L40 62Z"/><path class="d" d="M46 62 l5 8 l5 -8 l5 8 l5 -8 l5 8 l5 -8 l5 8"/>
<path class="d" d="M170 52 V100"/><rect class="d" x="156" y="52" width="30" height="14"/>
<path class="d" d="M240 52 V110 H282"/>
<path class="d" d="M310 52 V104 M302 104 H318"/>
<rect class="d" x="140" y="188" width="196" height="14" rx="2"/><path class="d" d="M156 202 V250 M320 202 V250"/>
<rect class="d" x="170" y="168" width="112" height="20"/>
<path class="d m" d="M296 182 q10 -16 20 -2 q-8 8 -14 0 M318 178 q8 -12 16 -2"/>
${person(246,250,1.1,{arms:'M0 -47 L-16 -35 L-30 -26'})}
${person(82,250,.74)}
<path class="d" d="M138 92 q8 -14 20 -4" style="display:none"/>`;

ART[5]=()=>ground()+`
${person(255,250,1.12,{arms:'M0 -47 L-18 -38 L-42 -40 M0 -47 L14 -34'})}
${person(110,250,.82,{arms:'M0 -47 L18 -40 L38 -42 M0 -47 L-12 -34'})}
<g transform="rotate(-8 190 150)"><rect class="d fw" x="148" y="136" width="86" height="16" rx="2"/><path class="d" d="M158 144 H226"/></g>
<path class="d m" d="M148 176 q-6 28 -2 52 M158 170 q-6 20 -4 40"/>
<path class="d" d="M168 244 H232" style="display:none"/>
<rect class="d" x="156" y="224" width="86" height="16" rx="2" transform="rotate(5 199 232)"/>
<path class="d m" d="M120 70 q10 -16 24 -6 M278 74 q8 -10 18 -4"/>`;

ART[6]=()=>`
<path class="d" d="M24 168 H376"/>
${[80,200,320].map((x,i)=>`<circle class="d fw" cx="${x}" cy="168" r="${12}"/><circle class="f fm" cx="${x}" cy="168" r="5" style="--dl:${1.2+i*.5}s"/>`).join('')}
${T(80,128,'11',46)}${T(200,128,'14',46)}${T(320,128,'16',46,'mu')}
<path class="d" d="M52 244 L82 214 M64 206 l24 24 l-10 10 l-24 -24z"/><path class="d" d="M102 224 l-16 16"/>
<circle class="d m" cx="190" cy="232" r="14"/><circle class="d m" cx="212" cy="242" r="14"/><path class="d" d="M190 226 v12 M184 232 h12"/>
<path class="d" d="M286 238 L312 226 L330 232 M356 238 L334 226 L318 232 L312 228"/><path class="d m" d="M306 232 q12 14 26 0"/>
${TL(80,282,['aprender'],15)}${TL(200,282,['trabalhar'],15)}${TL(320,282,['dividir resultados'],15)}`;

ART[7]=()=>ground()+`
<rect class="d" x="24" y="60" width="124" height="94" rx="6"/><path class="d" d="M86 154 V176 M62 176 H110"/>

{k:'Automação',t:'Da automação à criação de sistemas',main:['Processos organizados.','Conhecimento centralizado.'],

 n:['Quando comecei a explorar a inteligência artificial, percebi que ela poderia potencializar tudo aquilo que havia desenvolvido durante minha trajetória.','Minha capacidade de aprender.','Minha experiência com processos.','Minha visão de negócio.','Minha criatividade para encontrar soluções.','Passei a explorar a criação de aplicações web, automações e produtos digitais.','A inteligência artificial não mudou quem eu era.','Ela ampliou aquilo que eu era capaz de construir.']},
{k:'Inteligência artificial',t:'Construindo soluções',main:['Problemas reais.','Soluções digitais.'],
 n:['Comecei a aplicar essa capacidade em diferentes segmentos.','Criando aplicações para profissionais, empresas e operações que possuem problemas reais.','Cada projeto representa uma oportunidade de aprender, testar hipóteses e transformar ideias em soluções concretas.','Não quero simplesmente utilizar inteligência artificial.','Quero criar valor através dela.']},

 n:['Vivemos uma época em que ferramentas, profissões e modelos de negócio estão sendo transformados em uma velocidade impressionante.','Acredito que, independentemente dessas mudanças, três características continuarão sendo fundamentais.','A resiliência para enfrentar dificuldades e mudar de direção.','O brio para não se contentar com trabalhos medíocres e buscar conhecimento quando ele faz falta.','E a criatividade para enxergar possibilidades onde outros enxergam apenas problemas.','Minha história foi construída sobre essas três características.','Muito antes de conhecer a inteligência artificial.']},
{k:'Próximo capítulo',t:'O próximo capítulo',main:['O próximo capítulo','ainda não foi escrito.'],
 n:['Não posso prever quais ferramentas utilizarei daqui a cinco anos.','Não sei quais tecnologias irão surgir, nem quais problemas precisarei enfrentar.','Mas minha história demonstra que tenho disposição para aprender, capacidade para me adaptar e criatividade para construir.','Quero fazer parte de uma equipe que não esteja apenas acompanhando as transformações da inteligência artificial, mas que esteja criando soluções através dela.','Porque, antes da tecnologia, aprendi a resolver.','E ainda tenho muitos problemas para resolver.']},
{k:'Contato',t:'Encerramento e contato',main:['Vinicius Freire'],sub:'Resolvendo problemas desde antes de saber como chamá-los.',final:true,
 n:['Resiliência. Brio. Criatividade.','Obrigado por acompanhar minha trajetória.']}
];
const N=S.length;

/* ---------------------- estado e montagem ---------------------- */
const $=s=>document.querySelector(s);
const stage=$('#stage'),narr=$('#narr'),drawer=$('#drawer');
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const root=document.documentElement;
if(RM)root.classList.add('rm');
if((navigator.hardwareConcurrency||8)<=2)root.classList.add('lite');

function ink(lines,start,step){
  let i=0,out=[];
  lines.forEach(line=>{
    out.push(line.split(' ').map(w=>`<span class="w">${[...w].map(ch=>`<span class="c" style="--d:${Math.round(start+(i++)*step)}">${ch}</span>`).join('')}</span>`).join(' '));
  });
  return {html:out.join('<br>'),count:i};
}
function btn(key,label,pri){
  const u=LINKS[key];
  return u?`<a class="btn ${pri?'pri':''}" href="${u}" ${/^https?:/.test(u)?'target="_blank" rel="noopener"':''}>${label}</a>`
          :`<button class="btn ${pri?'pri':''}" data-pending="${key}" title="Link ainda não configurado">${label}</button>`;
}
const SHAPES='path,line,circle,rect,ellipse,polyline,polygon';
S.forEach((s,idx)=>{
  const sec=document.createElement('section');
  sec.className='slide';sec.dataset.i=idx;sec.inert=true;
  sec.setAttribute('aria-label',`Slide ${idx+1} de ${N}: ${s.t||s.main.join(' ')}`);
  const chars=s.main.join('').length;
  const step=Math.min(38,2600/Math.max(chars,1));
  const m=ink(s.main,500,step);
  const endMain=500+m.count*step;
  let extra='';
  if(s.impact){const im=ink([s.impact],endMain+300,22);extra+=`<p class="impact">${im.html}</p>`;}
  const dl=(endMain+(s.impact?1300:200)+'ms');
  if(s.sub)extra+=`<p class="sub">${s.sub}</p>`;
  const btns=s.final?`<div class="btns">${btn('whatsapp','Me chame no WhatsApp',1)}${btn('gabinete','Conheça o Gabinete Digital',0)}</div>`:'';
  sec.style.setProperty('--dl',dl);
  sec.innerHTML=`<div class="art"><svg viewBox="0 0 400 300" role="img" aria-label="${(s.t||s.main.join(' ')).replace(/"/g,'')}"><g filter="url(#rough)">${ART[idx+1]()}</g></svg></div>
   <div class="txt"><p class="kicker">${s.k}</p><h2 class="main ${s.cls||''}">${m.html}</h2>${extra}${btns}</div>`;
  stage.appendChild(sec);
  /* normaliza o comprimento dos traços e escalona a ordem de desenho */
  const els=[...sec.querySelectorAll('.art .d,.art .f')];
  const st=Math.min(.16,3.4/Math.max(els.length,1));
  els.forEach((el,i)=>{
    if(el.matches(SHAPES))el.setAttribute('pathLength','1');
    if(!el.style.getPropertyValue('--dl'))el.style.setProperty('--dl',(.25+i*st).toFixed(2)+'s');
  });
});
const slides=[...stage.children];

/* a linha que conecta a trajetória */
(function(){
  let d='M0 24',x=0;
  while(x<1000){x+=10;const y=24+11*Math.sin(x/62)+6*Math.sin(x/21+1)+(x>300&&x<345?-9*Math.sin((x-300)/45*Math.PI):0);d+=` L${x} ${y.toFixed(1)}`;}
  $('#trailBg').setAttribute('d',d);$('#trailFg').setAttribute('d',d);
})();
const trailBg=$('#trailBg'),trailFg=$('#trailFg'),pen=$('#pen'),wrap=$('#trailWrap');
function setTrail(i){
  const p=i/(N-1),L=trailBg.getTotalLength(),pt=trailBg.getPointAtLength(p*L),r=wrap.getBoundingClientRect();
  trailFg.style.strokeDashoffset=(1.03-p*1.03).toFixed(4);
  pen.style.left=(pt.x/1000*r.width)+'px';pen.style.top=(pt.y/46*r.height)+'px';
}

/* ---------------------- morphing do slide 1 ---------------------- */
const rot=(pts,deg)=>{const a=deg*Math.PI/180,c=Math.cos(a),s=Math.sin(a);return pts.map(([x,y])=>[x*c-y*s,x*s+y*c])};
const resample=(pts,n)=>{
  const P=[...pts,pts[0]],Ld=[0];
  for(let i=1;i<P.length;i++)Ld.push(Ld[i-1]+Math.hypot(P[i][0]-P[i-1][0],P[i][1]-P[i-1][1]));
  const tot=Ld[Ld.length-1],out=[];let j=1;
  for(let k=0;k<n;k++){const t=tot*k/n;while(Ld[j]<t)j++;const f=(t-Ld[j-1])/((Ld[j]-Ld[j-1])||1);
    out.push([P[j-1][0]+(P[j][0]-P[j-1][0])*f,P[j-1][1]+(P[j][1]-P[j-1][1])*f]);}
  return out;
};
const SHP=[
 rot([[-100,-14],[50,-14],[100,0],[50,14],[-100,14]],-32),                               /* lápis */
 rot([[-100,-17],[10,-17],[10,-8],[100,-8],[100,8],[10,8],[10,17],[-100,17]],-32),        /* formão */
 [[-80,-66],[80,-66],[80,30],[16,30],[16,50],[46,50],[46,62],[-46,62],[-46,50],[-16,50],[-16,30],[-80,30]], /* computador */
 [[0,-96],[17,-17],[96,0],[17,17],[0,96],[-17,17],[-96,0],[-17,-17]]                      /* IA */
].map(p=>resample(p,160).map(([x,y])=>[x+200,y+128]));
const toD=p=>'M'+p.map(q=>q[0].toFixed(1)+' '+q[1].toFixed(1)).join('L')+'Z';
const morphEl=document.getElementById('morph');
let mTok=0,mIdx=0;
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
function dots(i){for(let k=0;k<4;k++){const e=document.getElementById('dot'+k);if(e){e.classList.toggle('fm',k===i)}}}
function startMorph(){
  stopMorph();mIdx=0;morphEl.setAttribute('d',toD(SHP[RM?3:0]));dots(RM?3:0);
  if(RM)return;
  const tok=++mTok;
  const hold=(ms,fn)=>setTimeout(()=>{if(tok===mTok)fn()},ms);
  const step=()=>{
    const a=SHP[mIdx],b=SHP[(mIdx+1)%4];let t0=null;
    const f=ts=>{if(tok!==mTok)return;t0??=ts;const t=Math.min(1,(ts-t0)/1100),e=ease(t);
      morphEl.setAttribute('d',toD(a.map((p,i)=>[p[0]+(b[i][0]-p[0])*e,p[1]+(b[i][1]-p[1])*e])));
      if(t<1)requestAnimationFrame(f);else{mIdx=(mIdx+1)%4;dots(mIdx);hold(1500,step);}};
    requestAnimationFrame(f);
  };
  hold(2600,step);
}
function stopMorph(){mTok++}
morphEl.setAttribute('d',toD(SHP[0]));

/* ---------------------- narração e voz ---------------------- */
let aud=null,cur=-1,auto=false,voiceOn=false,timer=null,vTok=0,speakT=null;
const synth='speechSynthesis' in window?window.speechSynthesis:null;
function renderNarr(i){
  narr.innerHTML=S[i].n.map(p=>typeof p==='string'?`<p>${p}</p>`:`<p class="q">“${p.q}”</p>`).join('');
  narr.scrollTop=0;
}
function stopSpeak(){vTok++;clearTimeout(speakT);if(aud){aud.onended=aud.onerror=null;aud.pause();aud=null}if(synth)synth.cancel();narr.querySelectorAll('.say').forEach(e=>e.classList.remove('say'))}
function speak(){
  stopSpeak();if(!voiceOn)return;
  const tok=vTok,ps=[...narr.children];let k=0;
  const done=()=>{if(auto)speakT=setTimeout(()=>{if(tok===vTok)go(cur+1)},900)};
  const synthFallback=()=>{if(tok===vTok&&synth)speakSynth(tok,ps,done)};
  const a=new Audio(AUDIO.dir+String(cur+1).padStart(2,'0')+'.'+AUDIO.ext);
  aud=a;a.onerror=()=>{if(aud===a){aud=null;synthFallback()}};
  a.onended=()=>{if(aud===a){aud=null;done()}};
  speakT=setTimeout(()=>{if(tok===vTok)a.play().catch(()=>{if(aud===a){aud=null;synthFallback()}})},700);
}
function speakSynth(tok,ps,done){
  let k=0;
  const voice=synth.getVoices().find(v=>/^pt[-_]BR/i.test(v.lang))||synth.getVoices().find(v=>/^pt/i.test(v.lang));
  const nextP=()=>{
    if(tok!==vTok)return;
    ps.forEach(p=>p.classList.remove('say'));
    if(k>=ps.length){done();return;}
    const p=ps[k++];p.classList.add('say');p.scrollIntoView({block:'nearest',behavior:RM?'auto':'smooth'});
    const u=new SpeechSynthesisUtterance(p.textContent.replace(/[“”]/g,''));
    u.lang='pt-BR';if(voice)u.voice=voice;u.rate=.97;u.onend=nextP;u.onerror=nextP;synth.speak(u);
  };
  speakT=setTimeout(nextP,700);
}
function dur(i){const w=S[i].n.map(p=>typeof p==='string'?p:p.q).join(' ').split(/\s+/).length;return Math.max(7000,w*380+3500)}
function schedule(){
  clearTimeout(timer);
  if(!auto||voiceOn)return;
  timer=setTimeout(()=>{cur<N-1?go(cur+1):setAuto(false)},dur(cur));
}
function setAuto(v){
  auto=v;$('#bAuto').setAttribute('aria-pressed',v);$('#bAuto').textContent=v?'❚❚ Pausar':'▶ Auto';
  if(!v){clearTimeout(timer);}else{if(cur===N-1)go(0);else{schedule();if(voiceOn&&!aud&&!(synth&&synth.speaking))speak();}}
}
function setVoice(v){
  voiceOn=v;$('#bVoice').setAttribute('aria-pressed',v);
  if(v){setDrawer(true);speak();clearTimeout(timer);}else{stopSpeak();schedule();}
}
function setDrawer(v){drawer.classList.toggle('open',v);$('#bNarr').setAttribute('aria-expanded',v)}

/* ---------------------- navegação ---------------------- */
function go(n,instant){
  n=Math.max(0,Math.min(N-1,n));
  if(n===cur)return;
  const dir=n>cur?1:-1,old=cur;
  stage.style.setProperty('--enter',(dir*36)+'px');stage.style.setProperty('--leave',(-dir*36)+'px');
  if(old>=0){const o=slides[old];o.classList.remove('active');o.classList.add('out');o.inert=true;setTimeout(()=>o.classList.remove('out'),700);}
  cur=n;
  const s=slides[n];
  s.classList.remove('out');
  /* reinicia as animações quando o slide volta a entrar */
  void s.offsetWidth;
  s.classList.add('active');s.inert=false;
  renderNarr(n);
  $('#count').textContent=String(n+1).padStart(2,'0')+' / '+N;
  wrap.setAttribute('aria-valuenow',n+1);
  $('#prev').disabled=n===0;$('#next').disabled=n===N-1;
  setTrail(n);
  history.replaceState(null,'','#'+(n+1));
  n===0?startMorph():stopMorph();
  stopSpeak();speak();schedule();
}
const next=()=>go(cur+1),prev=()=>go(cur-1);
$('#next').onclick=()=>{next()};$('#prev').onclick=()=>{prev()};
$('#bAuto').onclick=()=>setAuto(!auto);
$('#bNarr').onclick=()=>setDrawer(!drawer.classList.contains('open'));
$('#bClose').onclick=()=>setDrawer(false);
$('#bVoice').hidden=false;$('#bVoice').onclick=()=>setVoice(!voiceOn);if(synth)synth.getVoices();

addEventListener('keydown',e=>{
  if(e.target.closest&&e.target.closest('a,button')&&(e.key===' '||e.key==='Enter'))return;
  const k=e.key;
  if(k==='ArrowRight'||k==='ArrowDown'||k==='PageDown'||k===' '){e.preventDefault();next()}
  else if(k==='ArrowLeft'||k==='ArrowUp'||k==='PageUp'){e.preventDefault();prev()}
  else if(k==='Home')go(0);else if(k==='End')go(N-1);
  else if(k==='p'||k==='P')setAuto(!auto);
  else if(k==='n'||k==='N')setDrawer(!drawer.classList.contains('open'));
  else if(k==='Escape')setDrawer(false);
});
/* deslize */
let sx=0,sy=0,st=0,sid=null;
stage.addEventListener('pointerdown',e=>{if(e.target.closest('a,button,#drawer'))return;sx=e.clientX;sy=e.clientY;st=Date.now();sid=e.pointerId});
stage.addEventListener('pointerup',e=>{
  if(e.pointerId!==sid)return;sid=null;
  const dx=e.clientX-sx,dy=e.clientY-sy;
  if(Math.abs(dx)>48&&Math.abs(dx)>Math.abs(dy)*1.3&&Date.now()-st<900)dx<0?next():prev();
});
/* roda do mouse */
let wl=0,wa=0;
stage.addEventListener('wheel',e=>{
  if(e.target.closest('#drawer'))return;
  const now=Date.now();if(now-wl<750)return;
  wa+=e.deltaY+e.deltaX;
  if(Math.abs(wa)>50){wl=now;(wa>0?next:prev)();wa=0}
},{passive:true});
/* parallax discreto */
if(!RM&&matchMedia('(pointer:fine)').matches){
  let raf=0;
  stage.addEventListener('pointermove',e=>{
    if(raf)return;raf=requestAnimationFrame(()=>{raf=0;
      const nx=e.clientX/innerWidth-.5,ny=e.clientY/innerHeight-.5;
      stage.style.setProperty('--px',(nx*-10).toFixed(1)+'px');stage.style.setProperty('--py',(ny*-8).toFixed(1)+'px');
      stage.style.setProperty('--bx',(nx*14).toFixed(1)+'px');stage.style.setProperty('--by',(ny*14).toFixed(1)+'px');});
  });
}
/* links ainda não informados */
const toast=$('#toast');let tt;
stage.addEventListener('click',e=>{
  const b=e.target.closest('[data-pending]');if(!b)return;
  toast.textContent='Link ainda não configurado — preencha LINKS no início do script em index.html.';
  toast.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>toast.classList.remove('show'),3200);
});
document.addEventListener('visibilitychange',()=>{if(document.hidden){clearTimeout(timer);if(synth)synth.pause();if(aud)aud.pause()}else{if(synth)synth.resume();if(aud)aud.play().catch(()=>{});schedule()}});
addEventListener('resize',()=>setTrail(Math.max(cur,0)));

const h=parseInt(location.hash.slice(1),10);
go(h>=1&&h<=N?h-1:0);
</script>
