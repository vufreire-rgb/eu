name: Publicar no GitHub Pages

# Publica, em um único site:
#   /          -> apresentação Draw My Life (index.html, audio/)
#   /gabinete/ -> protótipo Gabinete Digital (Next.js exportado como estático)
on:
  push:
    branches: [main, ccr-1b38554c-6juspr]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gabinete-digital/package-lock.json
      - name: Build do Gabinete Digital
        working-directory: gabinete-digital
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}/gabinete
        run: |
          npm ci
          npm run build
      - name: Montar o site
        run: |
          mkdir -p _site
          cp index.html _site/
          [ -d audio ] && cp -r audio _site/audio
          cp -r gabinete-digital/out _site/gabinete
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
